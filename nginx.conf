user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;  # Reduced from 50M for security
    
    # Security improvements
    server_tokens off;  # Hide nginx version
    client_body_timeout 30s;
    client_header_timeout 30s;
    large_client_header_buffers 2 1k;
    
    # Rate limiting - Enhanced for security
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Map for blocking suspicious requests
    map $http_user_agent $bad_bot {
        default 0;
        ~*(bot|crawler|spider|scan|hack|exploit) 1;
        ~*(sqlmap|nmap|masscan|nikto|dirb|gobuster) 1;
        ~*(python-requests|curl|wget) 1;
    }
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # HTTP Server (port 80) - Redirect to HTTPS only
    server {
        listen 80;
        server_name greenpeak.ir www.greenpeak.ir;
        
        # Security headers even for HTTP
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Redirect all HTTP to HTTPS
        return 301 https://greenpeak.ir$request_uri;
    }
    
    # Localhost HTTP for internal use only
    server {
        listen 80;
        server_name localhost 127.0.0.1;
        
        # Restrict to localhost only
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
        }

        # Backend API with rate limiting
        location /api/ {
            # Block suspicious bots
            if ($bad_bot) {
                return 403;
            }
            
            # Rate limiting
            limit_req zone=api burst=20 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
        }
    }

    # HTTPS Server (port 443)
    server {
        listen 443 ssl http2;
        server_name greenpeak.ir www.greenpeak.ir localhost 127.0.0.1;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/greenpeak.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/greenpeak.ir/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Enhanced Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;

        # Allow internal and tunnel connections
        set $allowed 0;
        if ($remote_addr ~ "^127\.0\.0\.1$") { set $allowed 1; }
        if ($remote_addr ~ "^10\.") { set $allowed 1; }
        if ($remote_addr ~ "^172\.(1[6-9]|2[0-9]|3[0-1])\.") { set $allowed 1; }
        if ($remote_addr ~ "^192\.168\.") { set $allowed 1; }
        if ($host ~ "^(greenpeak\.tech|www\.greenpeak\.tech|localhost)$") { set $allowed 1; }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

        # Client upload limit
        client_max_body_size 10M;

        # MongoDB connection protection
        location /api/mongodb {
            deny all;
            return 403;
        }
        
        # Database admin interfaces protection
        location ~ ^/(mongo-express|phpmyadmin|adminer) {
            deny all;
            return 403;
        }

        # Block common attack patterns
        location ~ \.(php|asp|aspx|jsp|cgi)$ {
            deny all;
            return 403;
        }

        # Block suspicious file access
        location ~ /\.(ht|git|svn|env) {
            deny all;
            return 403;
        }

       location ^~ /api/intermarket {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
       }


        location = /api/market/news-sentiment {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        location /api/market/sp500 {
            proxy_pass http://127.0.0.1:3000;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Backend API (FastAPI) - strip /api prefix
        location /api/ {
            # Block suspicious bots
            if ($bad_bot) {
                return 403;
            }
            
            # Additional security checks
            if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS)$) {
                return 405;
            }
            
            # Rate limiting
            limit_req zone=api burst=20 nodelay;
            limit_req zone=global burst=200 nodelay;
            limit_conn addr 10;
            
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            
            # Completely disable connection upgrades
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
        }

        # WebSocket support for development hot reload
        location /_next/webpack-hmr {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static files
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Logs
        access_log /var/log/nginx/greenpeak.ir.access.log;
        error_log /var/log/nginx/greenpeak.ir.error.log;
    }

    # Simple server for internal/tunnel connections
    server {
        listen 8080;
        server_name _;

        location = /api/intermarket {
            proxy_pass http://127.0.0.1:3000/api/intermarket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
}

        # Frontend (Next.js)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Backend API (FastAPI)
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # Direct backend access
        location /backend/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        access_log /var/log/nginx/internal.access.log;
        error_log /var/log/nginx/internal.error.log;
    }
}
